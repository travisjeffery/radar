# GoReleaser configuration for radar.
# https://goreleaser.com
version: 2

project_name: radar

before:
  hooks:
    - go mod tidy

builds:
  - id: radar
    main: ./cmd/radar
    binary: radar
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: radar-gh
    main: ./cmd/radar-gh
    binary: radar-gh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    ids: [radar, radar-gh]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: travisjeffery
    name: radar
